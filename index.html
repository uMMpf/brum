<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Apps Script web app. Changed once, 16 Aug 2026, when the backend moved
        // to a new deployment. See CLAUDE.md before touching this.
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1D0boGvfu1BKD-v9qB9RKTRyA-09VvR6rkrm6T1uzU8KNdVUcN5TZzKeQm-aSezJQ/exec';

        // Generic placeholder names — NO real names live in this file.
        // Real names AND the write token arrive privately via a #cfg=<base64>
        // link, then cached in localStorage. Storage and all logic use IDs
        // (c1.., f1..). A config is { n: { children, families }, k: '<token>' }.
        const DEFAULT_NAMES = {
            children: { 'c1': 'Dijete 1', 'c2': 'Dijete 2', 'c3': 'Dijete 3' },
            families: { 'f1': 'Obitelj 1', 'f2': 'Obitelj 2', 'f3': 'Obitelj 3' }
        };

        const CFG_KEY = 'carpoolCfg';
        const LEGACY_KEY = 'carpoolNames';

        // UTF-8-safe base64 so Croatian diacritics survive a round trip
        const b64dec = (s) => decodeURIComponent(escape(atob(s)));

        // A config is only usable if it carries both name maps.
        const normalizeConfig = (cfg) =>
            (cfg && cfg.n && cfg.n.children && cfg.n.families) ? cfg : null;

        // Accepts a full pasted URL, a bare #cfg= / #names= fragment, or a bare
        // base64 code. Handles both the new combined payload and the old
        // names-only one. Returns a config object or null.
        const parseConfig = (text) => {
            const s = (text || '').trim();
            if (!s) return null;
            const mCfg = s.match(/[#&?]cfg=([^&\s]+)/);
            const mOld = s.match(/[#&?]names=([^&\s]+)/);
            try {
                if (mCfg) return normalizeConfig(JSON.parse(b64dec(decodeURIComponent(mCfg[1]))));
                if (mOld) return normalizeConfig({ n: JSON.parse(b64dec(decodeURIComponent(mOld[1]))) });
                const parsed = JSON.parse(b64dec(decodeURIComponent(s)));
                return normalizeConfig(parsed?.n ? parsed : { n: parsed });
            } catch (e) {
                return null;
            }
        };

        function resolveConfig() {
            // 1) #cfg= (or legacy #names=) in the URL -> cache it, strip the fragment
            try {
                const cfg = parseConfig(location.hash || '');
                if (cfg) {
                    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
                    history.replaceState(null, '', location.pathname + location.search);
                    return cfg;
                }
            } catch (e) {
                console.error('Config resolve (url) error:', e);
            }
            // 2) cached config, then the legacy names-only cache
            try {
                const s = localStorage.getItem(CFG_KEY);
                if (s) {
                    const cfg = normalizeConfig(JSON.parse(s));
                    if (cfg) return cfg;
                }
                const legacy = localStorage.getItem(LEGACY_KEY);
                if (legacy) {
                    const cfg = normalizeConfig({ n: JSON.parse(legacy) });
                    if (cfg) return cfg;
                }
            } catch (e) {
                console.error('Config resolve (storage) error:', e);
            }
            // 3) nothing stored -> placeholders plus the "nedostaju imena" banner
            return null;
        }

        const CFG = resolveConfig();
        const HAS_CONFIG = !!CFG;

        // Merged two levels deep: a link carrying only some of the names falls
        // back to placeholders for the rest instead of wiping them.
        const NAME_MAP = {
            children: { ...DEFAULT_NAMES.children, ...(CFG?.n?.children || {}) },
            families: { ...DEFAULT_NAMES.families, ...(CFG?.n?.families || {}) }
        };

        const WRITE_TOKEN = CFG?.k || null;

        // ---- presentation layer ----------------------------------------------

        const MY_FAMILY_KEY = 'carpoolMyFamily';

        const PRACTICES = [
            { id: 'pon', day: 'Pon', time: '20:00-21:15' },
            { id: 'uto', day: 'Uto', time: '18:30-20:00' },
            { id: 'cet', day: 'Čet', time: '18:30-20:00' },
            { id: 'pet', day: 'Pet', time: '17:00-18:30' },
            { id: 'sub', day: 'Sub', time: '12:00-13:30' }
        ];
        const startTime = (p) => p.time.split('-')[0];

        const CHILD_IDS = ['c2', 'c1', 'c3'];   // fixed display order, unchanged
        const FAMILY_IDS = Object.keys(NAME_MAP.families);
        // Family N drives child N — the pairing the "TJEDAN ZA" header shows.
        const childOfFamily = (familyId) => 'c' + familyId.slice(1);
        const familyNumber = (familyId) => FAMILY_IDS.indexOf(familyId) + 1;

        const MONTHS = ['siječnja', 'veljače', 'ožujka', 'travnja', 'svibnja', 'lipnja',
                        'srpnja', 'kolovoza', 'rujna', 'listopada', 'studenoga', 'prosinca'];

        const getMondayOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        const getCurrentWeekStart = () => {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            // Subota poslije 15:00 ili nedjelja = planiraj sljedeći tjedan
            if ((day === 6 && hour >= 15) || day === 0) {
                const nextWeek = new Date(now);
                const daysToAdd = day === 0 ? 1 : 2;
                nextWeek.setDate(now.getDate() + daysToAdd);
                return getMondayOfWeek(nextWeek);
            }
            return getMondayOfWeek(now);
        };

        const getWeekKey = (mondayDate) => {
            const d = new Date(mondayDate);
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        };

        const addDays = (date, n) => {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        };

        const formatWeekRange = (monday) => {
            const sunday = addDays(monday, 6);
            const left = monday.getMonth() === sunday.getMonth()
                ? `${monday.getDate()}.`
                : `${monday.getDate()}. ${MONTHS[monday.getMonth()]}`;
            return `${left} – ${sunday.getDate()}. ${MONTHS[sunday.getMonth()]} ${sunday.getFullYear()}.`;
        };

        // Config is missing: everyone reaches the app through the pinned WhatsApp
        // link, so tapping it again beats copy-pasting. Message only, no input.
        const MissingNamesBanner = () => {
            if (HAS_CONFIG) return null;
            return (
                <div className="border-2 border-[#ec3013] bg-white px-4 py-3 mb-6">
                    <p className="text-[13px] font-semibold leading-snug">
                        🔑 Nedostaju imena. Klikni privatni link u WhatsApp grupi.
                    </p>
                </div>
            );
        };

        const SectionLabel = ({ children }) => (
            <h2 className="text-[13px] font-extrabold tracking-[0.12em] uppercase mb-3 break-words">{children}</h2>
        );

        const Rule = () => <div className="border-t-2 border-[#201e1d] my-6"></div>;

        const CarpoolApp = () => {
            const [weekStart, setWeekStart] = useState(getCurrentWeekStart());
            const [weekHistory, setWeekHistory] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [showResults, setShowResults] = useState(false);
            const [askNewWeek, setAskNewWeek] = useState(false);
            const [copied, setCopied] = useState(false);
            const [unlockPast, setUnlockPast] = useState(false);
            // idle | saving | saved | error | unauthorized
            const [saveState, setSaveState] = useState('idle');
            const [savedAt, setSavedAt] = useState(null);
            const [pendingSave, setPendingSave] = useState(null);
            const [myFamily, setMyFamily] = useState(() => {
                try {
                    const s = localStorage.getItem(MY_FAMILY_KEY);
                    if (s && FAMILY_IDS.indexOf(s) !== -1) return s;
                } catch (e) {}
                return FAMILY_IDS[0];
            });

            const myChild = childOfFamily(myFamily);

            const loadFromSheets = async () => {
                if (SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
                    console.log('Google Sheets not configured yet');
                    return false;
                }
                try {
                    const response = await fetch(SCRIPT_URL);
                    if (response.ok) {
                        const data = await response.json();
                        setWeekHistory(data);
                        return true;
                    }
                } catch (error) {
                    console.error('Google Sheets load error:', error);
                }
                return false;
            };

            const saveToSheets = async (data) => {
                if (SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
                    return false;
                }

                setSaveState('saving');
                try {
                    // text/plain keeps this a simple request, so no preflight and
                    // no need for no-cors — which means the response is readable
                    // and a failed save can finally be reported as one.
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ token: WRITE_TOKEN || '', data })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);

                    const out = await res.json();
                    if (out && out.ok) {
                        setSavedAt(out.savedAt ? new Date(out.savedAt) : new Date());
                        setPendingSave(null);
                        setSaveState('saved');
                        return true;
                    }
                    if (out && out.error === 'unauthorized') {
                        setPendingSave(data);
                        setSaveState('unauthorized');
                        return false;
                    }
                    throw new Error(out && out.error ? out.error : 'unknown');
                } catch (error) {
                    console.error('Google Sheets save error:', error);
                    setPendingSave(data);
                    setSaveState('error');
                    return false;
                }
            };

            useEffect(() => {
                const loadData = async () => {
                    setIsLoading(true);
                    const sheetsSuccess = await loadFromSheets();
                    if (!sheetsSuccess) {
                        try {
                            const saved = localStorage.getItem('carpoolHistory');
                            if (saved) setWeekHistory(JSON.parse(saved));
                        } catch (error) {
                            console.error('LocalStorage load error:', error);
                        }
                    }
                    setIsLoading(false);
                };
                loadData();
            }, []);

            // Success toast auto-hides; failure and unauthorized persist.
            useEffect(() => {
                if (saveState !== 'saved') return;
                const t = setTimeout(() => setSaveState('idle'), 3000);
                return () => clearTimeout(t);
            }, [saveState, savedAt]);

            const saveData = async (newHistory) => {
                setWeekHistory(newHistory);

                // localStorage first, so nothing is lost when the remote save fails
                try {
                    localStorage.setItem('carpoolHistory', JSON.stringify(newHistory));
                } catch (error) {
                    console.error('LocalStorage save error:', error);
                }

                await saveToSheets(newHistory);
            };

            const weekKey = getWeekKey(weekStart);
            const weekData = weekHistory[weekKey] || { selections: {}, assignments: {}, lastGenerated: null, lastModified: null };
            const selections = weekData.selections || {};
            const assignments = weekData.assignments || {};
            const lastGenerated = weekData.lastGenerated;
            const lastModified = weekData.lastModified;

            const isDateInPast = (practiceId) => {
                const now = new Date();
                const today = now.getDay();
                const hour = now.getHours();
                const nowWeekStart = getMondayOfWeek(now).getTime();

                if (weekStart.getTime() > nowWeekStart) return false;
                if (weekStart.getTime() < nowWeekStart) return true;
                if ((today === 6 && hour >= 15) || today === 0) return false;

                const dayMap = { 'pon': 1, 'uto': 2, 'cet': 4, 'pet': 5, 'sub': 6 };
                if (today === 6 && practiceId === 'sub') return false;
                return dayMap[practiceId] < today;
            };

            // Locked unless the hidden unlock is on (5 taps on the week range).
            const isLocked = (practiceId) => isDateInPast(practiceId) && !unlockPast;

            const updateWeekData = (newSelections, newAssignments, newLastGenerated) => {
                const now = new Date();
                const newHistory = {
                    ...weekHistory,
                    [weekKey]: {
                        selections: newSelections || selections,
                        assignments: newAssignments || assignments,
                        lastGenerated: newLastGenerated !== undefined ? newLastGenerated : lastGenerated,
                        lastModified: now
                    }
                };
                saveData(newHistory);
            };

            const toggleSelection = (item, dayId, type) => {
                const key = `${item}-${dayId}-${type}`;
                const newSelections = { ...selections, [key]: !selections[key] };
                updateWeekData(newSelections, assignments, lastGenerated);
            };

            // undefined = još prazno, false = ne dolazi, true = dolazi
            const cellState = (key) => {
                const v = selections[key];
                if (v === true) return 'on';
                if (v === false) return 'off';
                return 'empty';
            };

            const attendingOn = (dayId) =>
                CHILD_IDS.filter(c => selections[`${c}-${dayId}-child`] === true);

            const driversOn = (dayId, leg) =>
                FAMILY_IDS.filter(f => selections[`${f}-${dayId}-${leg}`] === true);

            // none = nobody coming, missing = nema vozača, excess = višak, ok = one driver
            const coverage = (dayId, leg) => {
                const drivers = driversOn(dayId, leg);
                if (attendingOn(dayId).length === 0) return { kind: 'none', drivers };
                if (drivers.length === 0) return { kind: 'missing', drivers };
                if (drivers.length > 1) return { kind: 'excess', drivers };
                return { kind: 'ok', drivers };
            };

            // ---- schedule generation (behaviour unchanged from before the redesign) ----
            const hasEnoughData = () => {
                const hasChildren = PRACTICES.some(p => {
                    if (isDateInPast(p.id)) return false;
                    return CHILD_IDS.some(c => selections[`${c}-${p.id}-child`]);
                });
                const hasDrivers = FAMILY_IDS.some(f =>
                    PRACTICES.some(p => {
                        if (isDateInPast(p.id)) return false;
                        return selections[`${f}-${p.id}-tamo`] || selections[`${f}-${p.id}-nazad`];
                    })
                );
                return hasChildren && hasDrivers;
            };

            const generateAssignments = () => {
                const newAssignments = {};
                const counts = {};
                FAMILY_IDS.forEach(f => { counts[f] = 0; });

                PRACTICES.forEach(practice => {
                    if (isDateInPast(practice.id)) return;

                    const attending = attendingOn(practice.id);
                    if (attending.length === 0) return;

                    const availTo = driversOn(practice.id, 'tamo');
                    const availFrom = driversOn(practice.id, 'nazad');

                    if (availTo.length > 0) {
                        const driver = availTo.reduce((min, f) => counts[f] < counts[min] ? f : min);
                        newAssignments[`${practice.id}-tamo`] = driver;
                        counts[driver]++;
                    }

                    if (availFrom.length > 0) {
                        const options = availFrom.filter(f => f !== newAssignments[`${practice.id}-tamo`]);
                        const final = options.length > 0 ? options : availFrom;
                        const driver = final.reduce((min, f) => counts[f] < counts[min] ? f : min);
                        newAssignments[`${practice.id}-nazad`] = driver;
                        counts[driver]++;
                    }
                });

                updateWeekData(selections, newAssignments, new Date());
                setShowResults(true);
            };

            const scheduleExists = () => lastGenerated && Object.keys(assignments).length > 0;

            const dataChangedSinceGeneration = () => {
                if (!lastGenerated || !lastModified) return false;
                return new Date(lastModified) > new Date(lastGenerated);
            };

            const resetCurrentWeek = () => {
                const newHistory = { ...weekHistory };
                delete newHistory[weekKey];
                saveData(newHistory);
                setShowResults(false);
            };

            // ---- week navigation ----
            const newestWeekStart = () => {
                let newest = getCurrentWeekStart().getTime();
                Object.keys(weekHistory).forEach(k => {
                    const t = new Date(k + 'T00:00:00').getTime();
                    if (!isNaN(t) && t > newest) newest = t;
                });
                return newest;
            };

            const goPrev = () => {
                setAskNewWeek(false);
                setWeekStart(addDays(weekStart, -7));
            };

            const goNext = () => {
                const candidate = addDays(weekStart, 7);
                if (candidate.getTime() > newestWeekStart()) {
                    setAskNewWeek(true);
                    return;
                }
                setAskNewWeek(false);
                setWeekStart(candidate);
            };

            const confirmNewWeek = () => {
                setAskNewWeek(false);
                setWeekStart(addDays(weekStart, 7));
            };

            // Hidden unlock: 5 taps on the week range toggles past-day editing,
            // for record corrections. No affordance beyond the unlocked cells.
            const tapRef = useRef({ n: 0, t: 0 });
            const onRangeTap = () => {
                const now = Date.now();
                const r = tapRef.current;
                r.n = (now - r.t < 1500) ? r.n + 1 : 1;
                r.t = now;
                if (r.n >= 5) {
                    r.n = 0;
                    setUnlockPast(u => !u);
                }
            };

            const chooseFamily = (fid) => {
                setMyFamily(fid);
                try {
                    localStorage.setItem(MY_FAMILY_KEY, fid);
                } catch (e) {
                    console.error('Family save error:', e);
                }
            };

            // Uses the generated schedule when there is one, otherwise falls back
            // to live coverage so the button works before "Generiraj".
            const buildWhatsAppText = () => {
                const generated = scheduleExists();
                const lines = [];
                lines.push('🏀 Raspored prijevoza');
                lines.push(`Tjedan: ${formatWeekRange(weekStart)}`);
                lines.push('');
                PRACTICES.forEach(p => {
                    const attending = attendingOn(p.id);
                    if (attending.length === 0) return;
                    const label = (leg) => {
                        if (generated) {
                            const f = assignments[`${p.id}-${leg}`];
                            return f ? NAME_MAP.families[f] : '—';
                        }
                        const c = coverage(p.id, leg);
                        if (c.kind === 'missing') return 'NEMA VOZAČA';
                        if (c.kind === 'excess') return c.drivers.map(f => NAME_MAP.families[f]).join(' + ') + ' (dogovorite se)';
                        return NAME_MAP.families[c.drivers[0]];
                    };
                    lines.push(`${p.day} ${startTime(p)}`);
                    lines.push(`  Djeca: ${attending.map(c => NAME_MAP.children[c]).join(', ')}`);
                    lines.push(`  Odvoz: ${label('tamo')}`);
                    lines.push(`  Povratak: ${label('nazad')}`);
                    lines.push('');
                });
                return lines.join('\n').trim();
            };

            const copyForWhatsApp = async () => {
                const text = buildWhatsAppText();
                try {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    console.error('Clipboard error:', e);
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center px-4">
                        <div className="text-[13px] font-extrabold tracking-[0.12em] uppercase">Učitavanje…</div>
                    </div>
                );
            }

            const gridCols = { display: 'grid', gridTemplateColumns: '84px repeat(5, 1fr)', gap: '4px' };
            const editCols = { display: 'grid', gridTemplateColumns: '1fr 68px 68px 68px', gap: '4px' };

            const OverviewCell = ({ state }) => {
                if (state === 'on') return <div className="h-[34px] bg-[#201e1d]"></div>;
                if (state === 'off') return <div className="h-[34px] bg-[#e6e5e3]"></div>;
                return <div className="h-[34px] border border-dashed border-[#b9b7b4]"></div>;
            };

            const CoverageCell = ({ dayId, leg }) => {
                const c = coverage(dayId, leg);
                if (c.kind === 'none') {
                    return <div className="h-[34px] flex items-center justify-center text-[#b9b7b4] text-[13px]">·</div>;
                }
                if (c.kind === 'missing') {
                    return <div className="h-[34px] bg-[#ec3013] flex items-center justify-center text-white text-[15px] font-extrabold">—</div>;
                }
                if (c.kind === 'excess') {
                    return (
                        <div className="h-[34px] border-2 border-[#ec3013] flex items-center justify-center gap-1">
                            {c.drivers.map(f => (
                                <span key={f} className="text-[#ec3013] text-[13px] font-extrabold">{familyNumber(f)}</span>
                            ))}
                        </div>
                    );
                }
                return (
                    <div className="h-[34px] flex items-center justify-center">
                        <span className="w-6 h-6 bg-[#201e1d] text-white text-[12px] font-extrabold flex items-center justify-center">
                            {familyNumber(c.drivers[0])}
                        </span>
                    </div>
                );
            };

            const Toggle = ({ item, dayId, type }) => {
                const key = `${item}-${dayId}-${type}`;
                const on = selections[key] === true;
                const locked = isLocked(dayId);
                const conflict = on && type !== 'child' && coverage(dayId, type).kind === 'excess';

                let cls = 'border border-[#d6d4d2] bg-[#efeeec] text-[#b9b7b4]';
                if (on) cls = 'bg-[#201e1d] text-white border border-[#201e1d]';
                if (conflict) cls = 'border-2 border-[#ec3013] bg-[#fbdedb] text-[#ec3013]';

                return (
                    <button
                        type="button"
                        onClick={() => { if (!locked) toggleSelection(item, dayId, type); }}
                        disabled={locked}
                        aria-pressed={on}
                        className={`h-12 w-full flex items-center justify-center text-[18px] font-extrabold ${cls} ${locked ? 'opacity-40 cursor-not-allowed' : ''}`}
                    >
                        ✓
                    </button>
                );
            };

            const Toast = () => {
                if (saveState === 'idle') return null;
                const base = 'fixed left-0 right-0 bottom-0 px-4 py-3 flex items-center justify-between gap-3 z-50';
                if (saveState === 'saving') {
                    return (
                        <div className={`${base} bg-[#201e1d] text-white`}>
                            <span className="text-[13px] font-extrabold tracking-[0.12em] uppercase">Spremam…</span>
                        </div>
                    );
                }
                if (saveState === 'saved') {
                    return (
                        <div className={`${base} bg-[#201e1d] text-white`}>
                            <span className="text-[13px] font-extrabold tracking-[0.12em] uppercase">
                                ✓ Spremljeno u {savedAt.toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' })}
                            </span>
                        </div>
                    );
                }
                if (saveState === 'unauthorized') {
                    return (
                        <div className={`${base} bg-[#ec3013] text-white`}>
                            <span className="text-[13px] font-semibold leading-snug">
                                Za spremanje klikni privatni link iz WhatsApp grupe
                            </span>
                        </div>
                    );
                }
                return (
                    <div className={`${base} bg-[#ec3013] text-white`}>
                        <span className="text-[13px] font-semibold leading-snug">Nije spremljeno, pokušaj ponovno</span>
                        <button
                            type="button"
                            onClick={() => saveToSheets(pendingSave)}
                            className="shrink-0 h-11 px-4 bg-white text-[#ec3013] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Pokušaj ponovno
                        </button>
                    </div>
                );
            };

            const WeekNav = () => (
                <div className="flex items-center gap-3 mt-5">
                    <button
                        type="button"
                        onClick={goPrev}
                        aria-label="Prethodni tjedan"
                        className="w-11 h-11 shrink-0 border border-[#201e1d] text-[18px] font-semibold flex items-center justify-center"
                    >‹</button>
                    <div
                        onClick={onRangeTap}
                        className="flex-1 text-[15px] font-extrabold tracking-[0.04em] uppercase text-center select-none"
                    >
                        {formatWeekRange(weekStart)}
                    </div>
                    <button
                        type="button"
                        onClick={goNext}
                        aria-label="Sljedeći tjedan"
                        className="w-11 h-11 shrink-0 border border-[#201e1d] text-[18px] font-semibold flex items-center justify-center"
                    >›</button>
                </div>
            );

            const CopyButton = () => (
                <button
                    type="button"
                    onClick={copyForWhatsApp}
                    className="mt-5 h-12 w-full border-2 border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                >
                    {copied ? '✓ Kopirano' : 'Kopiraj za WhatsApp'}
                </button>
            );

            // ---- results screen ----
            if (showResults) {
                return (
                    <div className="max-w-[560px] mx-auto px-4 pt-6 pb-32">
                        <MissingNamesBanner />

                        <h1 className="text-[27px] leading-[1.05] font-extrabold tracking-[-0.01em] uppercase">
                            Predloženi raspored
                        </h1>
                        <div className="text-[15px] font-extrabold tracking-[0.04em] uppercase mt-3">
                            {formatWeekRange(weekStart)}
                        </div>

                        {(lastModified || lastGenerated) && (
                            <div className="mt-3 text-[11px] text-[#6f6b68] leading-relaxed">
                                {lastGenerated && <div>Generirano: {new Date(lastGenerated).toLocaleString('hr-HR')}</div>}
                                {lastModified && <div>Zadnja promjena: {new Date(lastModified).toLocaleString('hr-HR')}</div>}
                            </div>
                        )}

                        {dataChangedSinceGeneration() && (
                            <div className="mt-4 border-2 border-[#ec3013] px-3 py-2">
                                <p className="text-[12px] font-semibold text-[#ec3013] leading-snug">
                                    Podaci su promijenjeni nakon generiranja. Generiraj ponovno.
                                </p>
                            </div>
                        )}

                        <Rule />

                        {PRACTICES.map(p => {
                            const attending = attendingOn(p.id);
                            const driverTo = assignments[`${p.id}-tamo`];
                            const driverFrom = assignments[`${p.id}-nazad`];
                            const availTo = driversOn(p.id, 'tamo');
                            const availFrom = driversOn(p.id, 'nazad');
                            return (
                                <div key={p.id} className="border-b border-[#b9b7b4] pb-4 mb-4">
                                    <div className="flex items-baseline justify-between">
                                        <div className="text-[17px] font-extrabold">{p.day}</div>
                                        <div className="text-[12px] text-[#6f6b68]">{startTime(p)}</div>
                                    </div>

                                    <div className="mt-2 text-[13px]">
                                        <span className="text-[#6f6b68]">Djeca: </span>
                                        {attending.length > 0
                                            ? <span className="font-semibold break-words">{attending.map(c => NAME_MAP.children[c]).join(', ')}</span>
                                            : <span className="text-[#b9b7b4]">nitko</span>}
                                    </div>

                                    <div className="mt-2 grid grid-cols-2 gap-3">
                                        <div>
                                            <div className="text-[10px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68]">Odvoz</div>
                                            {driverTo
                                                ? <div className="text-[14px] font-extrabold break-words">{NAME_MAP.families[driverTo]}</div>
                                                : <div className={`text-[14px] font-extrabold ${attending.length > 0 ? 'text-[#ec3013]' : 'text-[#b9b7b4]'}`}>
                                                    {attending.length > 0 ? 'nema vozača' : '—'}
                                                  </div>}
                                        </div>
                                        <div>
                                            <div className="text-[10px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68]">Povratak</div>
                                            {driverFrom
                                                ? <div className="text-[14px] font-extrabold break-words">{NAME_MAP.families[driverFrom]}</div>
                                                : <div className={`text-[14px] font-extrabold ${attending.length > 0 ? 'text-[#ec3013]' : 'text-[#b9b7b4]'}`}>
                                                    {attending.length > 0 ? 'nema vozača' : '—'}
                                                  </div>}
                                        </div>
                                    </div>

                                    {attending.length > 0 && (
                                        <div className="mt-2 text-[10px] text-[#6f6b68] leading-snug break-words">
                                            Mogu voziti — tamo: {availTo.length ? availTo.map(f => NAME_MAP.families[f]).join(', ') : '—'} · nazad: {availFrom.length ? availFrom.map(f => NAME_MAP.families[f]).join(', ') : '—'}
                                        </div>
                                    )}
                                </div>
                            );
                        })}

                        <CopyButton />

                        <button
                            type="button"
                            onClick={() => setShowResults(false)}
                            className="mt-3 h-12 w-full bg-[#201e1d] text-white text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Uredi dostupnost
                        </button>

                        <button
                            type="button"
                            onClick={resetCurrentWeek}
                            className="mt-3 h-12 w-full border-2 border-[#ec3013] text-[#ec3013] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Reset tjedan
                        </button>

                        <Toast />
                    </div>
                );
            }

            // ---- editing screen ----
            return (
                <div className="max-w-[560px] mx-auto px-4 pt-6 pb-32">
                    <MissingNamesBanner />

                    <h1 className="text-[27px] leading-[1.05] font-extrabold tracking-[-0.01em] uppercase">
                        Tjedni raspored treninga
                    </h1>
                    <p className="text-[14px] text-[#6f6b68] mt-2">Označi kad dijete dolazi i kad možeš voziti</p>

                    <WeekNav />

                    {askNewWeek && (
                        <div className="mt-3 border-2 border-[#201e1d] px-3 py-3 flex items-center justify-between gap-3">
                            <span className="text-[13px] font-semibold">Započni novi tjedan?</span>
                            <div className="flex gap-2 shrink-0">
                                <button
                                    type="button"
                                    onClick={confirmNewWeek}
                                    className="h-11 px-4 bg-[#201e1d] text-white text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                >Da</button>
                                <button
                                    type="button"
                                    onClick={() => setAskNewWeek(false)}
                                    className="h-11 px-4 border border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                >Ne</button>
                            </div>
                        </div>
                    )}

                    <Rule />

                    {/* R0 — TKO DOLAZI */}
                    <SectionLabel>Tko dolazi</SectionLabel>

                    <div style={gridCols} className="mb-1">
                        <div></div>
                        {PRACTICES.map(p => (
                            <div key={p.id} className="text-center">
                                <div className="text-[13px] font-extrabold">{p.day}</div>
                                <div className="text-[11px] text-[#6f6b68]">{startTime(p)}</div>
                            </div>
                        ))}
                    </div>

                    {CHILD_IDS.map(childId => (
                        <div key={childId} style={gridCols} className="mb-1 items-center">
                            <div className="text-[14px] font-extrabold truncate pr-1" title={NAME_MAP.children[childId]}>
                                {NAME_MAP.children[childId]}
                            </div>
                            {PRACTICES.map(p => (
                                <OverviewCell key={p.id} state={cellState(`${childId}-${p.id}-child`)} />
                            ))}
                        </div>
                    ))}

                    {/* R1 — coverage rows, one per leg (delta vs prototype) */}
                    <div className="border-t-2 border-[#201e1d] mt-3 pt-3">
                        <div style={gridCols} className="mb-1 items-center">
                            <div className="text-[14px] font-extrabold truncate pr-1">Odvoz</div>
                            {PRACTICES.map(p => <CoverageCell key={p.id} dayId={p.id} leg="tamo" />)}
                        </div>
                        <div style={gridCols} className="items-center">
                            <div className="text-[14px] font-extrabold truncate pr-1">Povratak</div>
                            {PRACTICES.map(p => <CoverageCell key={p.id} dayId={p.id} leg="nazad" />)}
                        </div>
                    </div>

                    {/* One row at 390 px (R1): 10 px, tight gaps, swatches separate
                        the items so the "·" dividers are not needed to fit. */}
                    <div className="mt-4 flex flex-wrap items-center justify-between gap-x-1.5 gap-y-1 text-[10px] leading-none text-[#6f6b68] [&>span]:whitespace-nowrap">
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 bg-[#201e1d] inline-block"></span>dolazi</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 bg-[#e6e5e3] inline-block"></span>ne dolazi</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 border border-dashed border-[#b9b7b4] inline-block"></span>još prazno</span>
                        <span>broj = obitelj koja vozi</span>
                        <span className="text-[#ec3013] font-semibold">crveno = problem</span>
                    </div>

                    <Rule />

                    {/* R2 — MOJA OBITELJ */}
                    <SectionLabel>Moja obitelj</SectionLabel>
                    <div className="grid grid-cols-3 border-2 border-[#201e1d]">
                        {FAMILY_IDS.map((fid, i) => (
                            <button
                                key={fid}
                                type="button"
                                onClick={() => chooseFamily(fid)}
                                aria-pressed={myFamily === fid}
                                title={NAME_MAP.families[fid]}
                                className={`h-12 px-1 text-[13px] truncate ${i > 0 ? 'border-l-2 border-[#201e1d]' : ''} ${
                                    myFamily === fid ? 'bg-[#ec3013] text-white font-extrabold' : 'bg-white font-semibold'
                                }`}
                            >
                                {NAME_MAP.families[fid]}
                            </button>
                        ))}
                    </div>

                    <Rule />

                    {/* R3 — editing surface */}
                    <SectionLabel>
                        Tjedan za: {NAME_MAP.children[myChild]} / {NAME_MAP.families[myFamily]}
                    </SectionLabel>

                    <div style={editCols} className="mb-1">
                        <div></div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Dolazi</div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Odvoz</div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Povratak</div>
                    </div>

                    {PRACTICES.map(p => (
                        <div key={p.id} style={editCols} className="mb-1 items-center">
                            <div className="pr-2">
                                <div className="text-[15px] font-extrabold leading-tight">{p.day}</div>
                                <div className="text-[12px] text-[#6f6b68]">{startTime(p)}</div>
                            </div>
                            <Toggle item={myChild} dayId={p.id} type="child" />
                            <Toggle item={myFamily} dayId={p.id} type="tamo" />
                            <Toggle item={myFamily} dayId={p.id} type="nazad" />
                        </div>
                    ))}

                    <p className="text-[13px] text-[#6f6b68] leading-snug mt-4">
                        Jedan tap po polju — cijeli tjedan bez otvaranja dana. Odabir obitelji se pamti.
                    </p>

                    {hasEnoughData() && (
                        <div className="mt-5">
                            {scheduleExists() && !dataChangedSinceGeneration() ? (
                                <button
                                    type="button"
                                    onClick={() => setShowResults(true)}
                                    className="h-14 w-full bg-[#201e1d] text-white text-[13px] font-extrabold tracking-[0.08em] uppercase"
                                >
                                    Pregled rasporeda
                                </button>
                            ) : (
                                <div>
                                    {dataChangedSinceGeneration() && (
                                        <div className="border-2 border-[#ec3013] px-3 py-2 mb-3">
                                            <p className="text-[12px] font-semibold text-[#ec3013] leading-snug">
                                                Podaci su promijenjeni nakon generiranja. Generiraj ponovno.
                                            </p>
                                        </div>
                                    )}
                                    <button
                                        type="button"
                                        onClick={generateAssignments}
                                        className="h-14 w-full bg-[#ec3013] text-white text-[13px] font-extrabold tracking-[0.08em] uppercase"
                                    >
                                        Generiraj raspored
                                    </button>
                                    {scheduleExists() && (
                                        <button
                                            type="button"
                                            onClick={() => setShowResults(true)}
                                            className="mt-3 h-12 w-full border-2 border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                        >
                                            Prikaži stari raspored
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                    )}

                    <CopyButton />

                    <Toast />
                </div>
            );
        };

        ReactDOM.render(<CarpoolApp />, document.getElementById('root'));
    </script>
</body>
</html>
