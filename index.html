    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Modernist: Archivo, zero radius, 2 px rules, flush left. */
        :root {
            --ground: #f3f2f2;
            --ink: #201e1d;
            --accent: #ec3013;
            --off: #e6e5e3;   /* ne dolazi */
            --hair: #b9b7b4;  /* dashed / još prazno */
            --mute: #6f6b68;  /* secondary text */
        }
        html, body { background: var(--ground); }
        body {
            font-family: 'Archivo', system-ui, -apple-system, sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }
        * { border-radius: 0 !important; }
        button { font-family: inherit; -webkit-tap-highlight-color: transparent; }

        /* Pebbled leather on accent-filled surfaces. Two offset dot layers,
           ~1.5px dots ~9% darker than the accent, tiling 7px — meant to read as
           a texture at arm's length, not as visible dots. Sits behind the label,
           so text contrast is unchanged. */
        .pebble {
            background-image: radial-gradient(circle, #d72c11 0.75px, transparent 0.85px);
            background-size: 7px 7px;
        }

        /* Loading ball. Flat, no gradients. */
        @keyframes brum-bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-26px); }
        }
        .brum-bounce { animation: brum-bounce 0.62s cubic-bezier(.5, 0, .5, 1) infinite; }
        @media (prefers-reduced-motion: reduce) {
            .brum-bounce { animation: none; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Apps Script web app. Changed once, 16 Aug 2026, when the backend moved
        // to a new deployment. See CLAUDE.md before touching this.
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1D0boGvfu1BKD-v9qB9RKTRyA-09VvR6rkrm6T1uzU8KNdVUcN5TZzKeQm-aSezJQ/exec';

        // Generic placeholder names — NO real names live in this file.
        // Real names AND the write token arrive privately via a #cfg=<base64>
        // link, then cached in localStorage. Storage and all logic use IDs
        // (c1.., f1..). A config is { n: { children, families }, k: '<token>' }.
        const DEFAULT_NAMES = {
            children: { 'c1': 'Dijete 1', 'c2': 'Dijete 2', 'c3': 'Dijete 3' },
            families: { 'f1': 'Obitelj 1', 'f2': 'Obitelj 2', 'f3': 'Obitelj 3' }
        };

        const CFG_KEY = 'carpoolCfg';
        const LEGACY_KEY = 'carpoolNames';

        // UTF-8-safe base64 so Croatian diacritics survive a round trip
        const b64dec = (s) => decodeURIComponent(escape(atob(s)));

        // A config is only usable if it carries both name maps. Any extra field
        // (e.g. an optional `f` naming one family) is passed through untouched and
        // re-stored, so a future per-family link stays forward-compatible. Nothing
        // reads `f` today: the family is chosen on the device, not by the link.
        const normalizeConfig = (cfg) =>
            (cfg && cfg.n && cfg.n.children && cfg.n.families) ? cfg : null;

        // Accepts a full pasted URL, a bare #cfg= / #names= fragment, or a bare
        // base64 code. Handles both the new combined payload and the old
        // names-only one. Returns a config object or null.
        const parseConfig = (text) => {
            const s = (text || '').trim();
            if (!s) return null;
            const mCfg = s.match(/[#&?]cfg=([^&\s]+)/);
            const mOld = s.match(/[#&?]names=([^&\s]+)/);
            try {
                if (mCfg) return normalizeConfig(JSON.parse(b64dec(decodeURIComponent(mCfg[1]))));
                if (mOld) return normalizeConfig({ n: JSON.parse(b64dec(decodeURIComponent(mOld[1]))) });
                const parsed = JSON.parse(b64dec(decodeURIComponent(s)));
                return normalizeConfig(parsed?.n ? parsed : { n: parsed });
            } catch (e) {
                return null;
            }
        };

        function resolveConfig() {
            // 1) #cfg= (or legacy #names=) in the URL -> cache it, strip the fragment
            try {
                const cfg = parseConfig(location.hash || '');
                if (cfg) {
                    localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
                    history.replaceState(null, '', location.pathname + location.search);
                    return cfg;
                }
            } catch (e) {
                console.error('Config resolve (url) error:', e);
            }
            // 2) cached config, then the legacy names-only cache
            try {
                const s = localStorage.getItem(CFG_KEY);
                if (s) {
                    const cfg = normalizeConfig(JSON.parse(s));
                    if (cfg) return cfg;
                }
                const legacy = localStorage.getItem(LEGACY_KEY);
                if (legacy) {
                    const cfg = normalizeConfig({ n: JSON.parse(legacy) });
                    if (cfg) return cfg;
                }
            } catch (e) {
                console.error('Config resolve (storage) error:', e);
            }
            // 3) nothing stored -> placeholders plus the "nedostaju imena" banner
            return null;
        }

        const CFG = resolveConfig();
        const HAS_CONFIG = !!CFG;

        // Merged two levels deep: a link carrying only some of the names falls
        // back to placeholders for the rest instead of wiping them.
        const NAME_MAP = {
            children: { ...DEFAULT_NAMES.children, ...(CFG?.n?.children || {}) },
            families: { ...DEFAULT_NAMES.families, ...(CFG?.n?.families || {}) }
        };

        const WRITE_TOKEN = CFG?.k || null;

        // ---- presentation layer ----------------------------------------------

        const MY_FAMILY_KEY = 'carpoolMyFamily';

        const PRACTICES = [
            { id: 'pon', day: 'Pon', time: '20:00-21:15' },
            { id: 'uto', day: 'Uto', time: '18:30-20:00' },
            { id: 'cet', day: 'Čet', time: '18:30-20:00' },
            { id: 'pet', day: 'Pet', time: '17:00-18:30' },
            { id: 'sub', day: 'Sub', time: '12:00-13:30' }
        ];
        const startTime = (p) => p.time.split('-')[0];

        const CHILD_IDS = ['c2', 'c1', 'c3'];   // fixed display order, unchanged
        const FAMILY_IDS = Object.keys(NAME_MAP.families);
        // Family N drives child N — the pairing the "TJEDAN ZA" header shows.
        const childOfFamily = (familyId) => 'c' + familyId.slice(1);
        const familyNumber = (familyId) => FAMILY_IDS.indexOf(familyId) + 1;

        const MONTHS = ['siječnja', 'veljače', 'ožujka', 'travnja', 'svibnja', 'lipnja',
                        'srpnja', 'kolovoza', 'rujna', 'listopada', 'studenoga', 'prosinca'];

        const getMondayOfWeek = (date) => {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        };

        const getCurrentWeekStart = () => {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            // Subota poslije 15:00 ili nedjelja = planiraj sljedeći tjedan
            if ((day === 6 && hour >= 15) || day === 0) {
                const nextWeek = new Date(now);
                const daysToAdd = day === 0 ? 1 : 2;
                nextWeek.setDate(now.getDate() + daysToAdd);
                return getMondayOfWeek(nextWeek);
            }
            return getMondayOfWeek(now);
        };

        const getWeekKey = (mondayDate) => {
            const d = new Date(mondayDate);
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${day}`;
        };

        const addDays = (date, n) => {
            const d = new Date(date);
            d.setDate(d.getDate() + n);
            return d;
        };

        const formatWeekRange = (monday) => {
            const sunday = addDays(monday, 6);
            const left = monday.getMonth() === sunday.getMonth()
                ? `${monday.getDate()}.`
                : `${monday.getDate()}. ${MONTHS[monday.getMonth()]}`;
            return `${left} – ${sunday.getDate()}. ${MONTHS[sunday.getMonth()]} ${sunday.getFullYear()}.`;
        };

        // Config is missing: everyone reaches the app through the pinned WhatsApp
        // link, so tapping it again beats copy-pasting. Message only, no input.
        const MissingNamesBanner = () => {
            if (HAS_CONFIG) return null;
            return (
                <div className="border-2 border-[#ec3013] bg-white px-4 py-3 mb-6">
                    <p className="text-[13px] font-semibold leading-snug">
                        🔑 Nedostaju imena. Klikni privatni link u WhatsApp grupi.
                    </p>
                </div>
            );
        };

        // Flat basketball. `solid` = accent disc with ink seams (loading state);
        // otherwise an outline glyph inheriting currentColor (rules, small sizes).
        const Ball = ({ size = 14, solid = false, className = '', style = null }) => (
            <svg viewBox="0 0 32 32" width={size} height={size} className={className} style={style}
                 aria-hidden="true" focusable="false">
                <circle cx="16" cy="16" r="14"
                        fill={solid ? '#ec3013' : 'none'}
                        stroke={solid ? '#ec3013' : 'currentColor'} strokeWidth="2" />
                <g fill="none" stroke={solid ? '#201e1d' : 'currentColor'}
                   strokeWidth={solid ? 2 : 1.75} strokeLinecap="round">
                    <path d="M16 2 V30" />
                    <path d="M2 16 H30" />
                    <path d="M16 2 Q2 16 16 30" />
                    <path d="M16 2 Q30 16 16 30" />
                </g>
            </svg>
        );

        const SectionLabel = ({ children }) => (
            <h2 className="text-[13px] font-extrabold tracking-[0.12em] uppercase mb-3 break-words">{children}</h2>
        );

        const Rule = () => <div className="border-t-2 border-[#201e1d] my-6"></div>;

        const CarpoolApp = () => {
            const [weekStart, setWeekStart] = useState(getCurrentWeekStart());
            const [weekHistory, setWeekHistory] = useState({});
            const [isLoading, setIsLoading] = useState(true);
            const [showResults, setShowResults] = useState(false);
            const [askNewWeek, setAskNewWeek] = useState(false);
            const [unlockPast, setUnlockPast] = useState(false);
            // idle | saving | saved | error | unauthorized
            const [saveState, setSaveState] = useState('idle');
            const [savedAt, setSavedAt] = useState(null);
            const [pendingSave, setPendingSave] = useState(null);
            const [photoBusy, setPhotoBusy] = useState(false);
            const [photoNote, setPhotoNote] = useState('');

            // Nothing is ever preselected. Until this device picks a family the
            // editing matrix stays locked behind "Koja obitelj?".
            // The stored value is the DEVICE's family; a later switch is
            // session-only, so entering once on another family's behalf can never
            // silently persist into the next visit — that was the whole bug.
            const [deviceFamily, setDeviceFamily] = useState(() => {
                try {
                    const s = localStorage.getItem(MY_FAMILY_KEY);
                    if (s && FAMILY_IDS.indexOf(s) !== -1) return s;
                } catch (e) {}
                return null;
            });
            const [activeFamily, setActiveFamily] = useState(null);
            const [pendingFamily, setPendingFamily] = useState(null);
            const [switchConfirmed, setSwitchConfirmed] = useState(false);

            const myFamily = activeFamily || deviceFamily;
            const hasFamily = !!myFamily;
            const myChild = hasFamily ? childOfFamily(myFamily) : null;

            const loadFromSheets = async () => {
                if (SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
                    console.log('Google Sheets not configured yet');
                    return false;
                }
                try {
                    const response = await fetch(SCRIPT_URL);
                    if (response.ok) {
                        const data = await response.json();
                        setWeekHistory(data);
                        return true;
                    }
                } catch (error) {
                    console.error('Google Sheets load error:', error);
                }
                return false;
            };

            const saveToSheets = async (data) => {
                if (SCRIPT_URL === 'YOUR_SCRIPT_URL_HERE') {
                    return false;
                }

                setSaveState('saving');
                try {
                    // text/plain keeps this a simple request, so no preflight and
                    // no need for no-cors — which means the response is readable
                    // and a failed save can finally be reported as one.
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ token: WRITE_TOKEN || '', data })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);

                    const out = await res.json();
                    if (out && out.ok) {
                        setSavedAt(out.savedAt ? new Date(out.savedAt) : new Date());
                        setPendingSave(null);
                        setSaveState('saved');
                        return true;
                    }
                    if (out && out.error === 'unauthorized') {
                        setPendingSave(data);
                        setSaveState('unauthorized');
                        return false;
                    }
                    throw new Error(out && out.error ? out.error : 'unknown');
                } catch (error) {
                    console.error('Google Sheets save error:', error);
                    setPendingSave(data);
                    setSaveState('error');
                    return false;
                }
            };

            useEffect(() => {
                const loadData = async () => {
                    setIsLoading(true);
                    const sheetsSuccess = await loadFromSheets();
                    if (!sheetsSuccess) {
                        try {
                            const saved = localStorage.getItem('carpoolHistory');
                            if (saved) setWeekHistory(JSON.parse(saved));
                        } catch (error) {
                            console.error('LocalStorage load error:', error);
                        }
                    }
                    setIsLoading(false);
                };
                loadData();
            }, []);

            // Success toast auto-hides; failure and unauthorized persist.
            useEffect(() => {
                if (saveState !== 'saved') return;
                const t = setTimeout(() => setSaveState('idle'), 3000);
                return () => clearTimeout(t);
            }, [saveState, savedAt]);

            const saveData = async (newHistory) => {
                setWeekHistory(newHistory);

                // localStorage first, so nothing is lost when the remote save fails
                try {
                    localStorage.setItem('carpoolHistory', JSON.stringify(newHistory));
                } catch (error) {
                    console.error('LocalStorage save error:', error);
                }

                await saveToSheets(newHistory);
            };

            const weekKey = getWeekKey(weekStart);
            const weekData = weekHistory[weekKey] || { selections: {}, assignments: {}, lastGenerated: null, lastModified: null };
            const selections = weekData.selections || {};
            const assignments = weekData.assignments || {};
            const lastGenerated = weekData.lastGenerated;
            const lastModified = weekData.lastModified;
            const lastModifiedBy = weekData.lastModifiedBy;

            // "Zadnja promjena: <obitelj>, DD.MM. HH:MM" — only when the record
            // carries the attribution. Legacy weeks render nothing.
            const lastEditLine = () => {
                if (!lastModifiedBy || !lastModified) return null;
                const who = NAME_MAP.families[lastModifiedBy];
                if (!who) return null;
                const d = new Date(lastModified);
                if (isNaN(d.getTime())) return null;
                const p2 = (n) => String(n).padStart(2, '0');
                return `Zadnja promjena: ${who}, ${p2(d.getDate())}.${p2(d.getMonth() + 1)}. ${p2(d.getHours())}:${p2(d.getMinutes())}`;
            };

            const isDateInPast = (practiceId) => {
                const now = new Date();
                const today = now.getDay();
                const hour = now.getHours();
                const nowWeekStart = getMondayOfWeek(now).getTime();

                if (weekStart.getTime() > nowWeekStart) return false;
                if (weekStart.getTime() < nowWeekStart) return true;
                if ((today === 6 && hour >= 15) || today === 0) return false;

                const dayMap = { 'pon': 1, 'uto': 2, 'cet': 4, 'pet': 5, 'sub': 6 };
                if (today === 6 && practiceId === 'sub') return false;
                return dayMap[practiceId] < today;
            };

            // Locked unless the hidden unlock is on (5 taps on the week range).
            const isLocked = (practiceId) => isDateInPast(practiceId) && !unlockPast;

            const updateWeekData = (newSelections, newAssignments, newLastGenerated) => {
                const now = new Date();
                const newHistory = {
                    ...weekHistory,
                    [weekKey]: {
                        selections: newSelections || selections,
                        assignments: newAssignments || assignments,
                        lastGenerated: newLastGenerated !== undefined ? newLastGenerated : lastGenerated,
                        lastModified: now,
                        // Additive optional key. The family being edited FOR, which
                        // is the active one, not the device's. Older records simply
                        // lack it and render without the attribution line.
                        lastModifiedBy: myFamily || undefined
                    }
                };
                saveData(newHistory);
            };

            const toggleSelection = (item, dayId, type) => {
                const key = `${item}-${dayId}-${type}`;
                const newSelections = { ...selections, [key]: !selections[key] };
                updateWeekData(newSelections, assignments, lastGenerated);
            };

            // undefined = još prazno, false = ne dolazi, true = dolazi
            const cellState = (key) => {
                const v = selections[key];
                if (v === true) return 'on';
                if (v === false) return 'off';
                return 'empty';
            };

            const attendingOn = (dayId) =>
                CHILD_IDS.filter(c => selections[`${c}-${dayId}-child`] === true);

            const driversOn = (dayId, leg) =>
                FAMILY_IDS.filter(f => selections[`${f}-${dayId}-${leg}`] === true);

            // none = nobody coming, missing = nema vozača, ok = at least one driver.
            // Several families on one leg is NOT a problem — it is the input the
            // generator picks from, so it stays neutral. Red means only "nema vozača".
            const coverage = (dayId, leg) => {
                const drivers = driversOn(dayId, leg);
                if (attendingOn(dayId).length === 0) return { kind: 'none', drivers };
                if (drivers.length === 0) return { kind: 'missing', drivers };
                return { kind: 'ok', drivers };
            };

            // ---- schedule generation (behaviour unchanged from before the redesign) ----
            const hasEnoughData = () => {
                const hasChildren = PRACTICES.some(p => {
                    if (isDateInPast(p.id)) return false;
                    return CHILD_IDS.some(c => selections[`${c}-${p.id}-child`]);
                });
                const hasDrivers = FAMILY_IDS.some(f =>
                    PRACTICES.some(p => {
                        if (isDateInPast(p.id)) return false;
                        return selections[`${f}-${p.id}-tamo`] || selections[`${f}-${p.id}-nazad`];
                    })
                );
                return hasChildren && hasDrivers;
            };

            const generateAssignments = () => {
                const newAssignments = {};
                const counts = {};
                FAMILY_IDS.forEach(f => { counts[f] = 0; });

                PRACTICES.forEach(practice => {
                    if (isDateInPast(practice.id)) return;

                    const attending = attendingOn(practice.id);
                    if (attending.length === 0) return;

                    const availTo = driversOn(practice.id, 'tamo');
                    const availFrom = driversOn(practice.id, 'nazad');

                    if (availTo.length > 0) {
                        const driver = availTo.reduce((min, f) => counts[f] < counts[min] ? f : min);
                        newAssignments[`${practice.id}-tamo`] = driver;
                        counts[driver]++;
                    }

                    if (availFrom.length > 0) {
                        const options = availFrom.filter(f => f !== newAssignments[`${practice.id}-tamo`]);
                        const final = options.length > 0 ? options : availFrom;
                        const driver = final.reduce((min, f) => counts[f] < counts[min] ? f : min);
                        newAssignments[`${practice.id}-nazad`] = driver;
                        counts[driver]++;
                    }
                });

                updateWeekData(selections, newAssignments, new Date());
                setShowResults(true);
            };

            const scheduleExists = () => lastGenerated && Object.keys(assignments).length > 0;

            const dataChangedSinceGeneration = () => {
                if (!lastGenerated || !lastModified) return false;
                return new Date(lastModified) > new Date(lastGenerated);
            };

            // State 1 is the default view: if the week already has a schedule that
            // nothing has invalidated, open on it instead of the editing surface.
            // Runs once, after the initial load — week navigation must not yank the
            // user out of the matrix they are working in.
            const [openedDefaultView, setOpenedDefaultView] = useState(false);
            useEffect(() => {
                if (isLoading || openedDefaultView) return;
                setOpenedDefaultView(true);
                if (scheduleExists() && !dataChangedSinceGeneration()) setShowResults(true);
            }, [isLoading]);

            const resetCurrentWeek = () => {
                const newHistory = { ...weekHistory };
                delete newHistory[weekKey];
                saveData(newHistory);
                setShowResults(false);
            };

            // ---- week navigation ----
            const newestWeekStart = () => {
                let newest = getCurrentWeekStart().getTime();
                Object.keys(weekHistory).forEach(k => {
                    const t = new Date(k + 'T00:00:00').getTime();
                    if (!isNaN(t) && t > newest) newest = t;
                });
                return newest;
            };

            const goPrev = () => {
                setAskNewWeek(false);
                setWeekStart(addDays(weekStart, -7));
            };

            const goNext = () => {
                const candidate = addDays(weekStart, 7);
                if (candidate.getTime() > newestWeekStart()) {
                    setAskNewWeek(true);
                    return;
                }
                setAskNewWeek(false);
                setWeekStart(candidate);
            };

            const confirmNewWeek = () => {
                setAskNewWeek(false);
                setWeekStart(addDays(weekStart, 7));
            };

            // Hidden unlock: 5 taps on the week range toggles past-day editing,
            // for record corrections. No affordance beyond the unlocked cells.
            const tapRef = useRef({ n: 0, t: 0 });
            const onRangeTap = () => {
                const now = Date.now();
                const r = tapRef.current;
                r.n = (now - r.t < 1500) ? r.n + 1 : 1;
                r.t = now;
                if (r.n >= 5) {
                    r.n = 0;
                    setUnlockPast(u => !u);
                }
            };

            // First pick on this device: stored, no confirm.
            const pickDeviceFamily = (fid) => {
                setDeviceFamily(fid);
                setActiveFamily(null);
                try {
                    localStorage.setItem(MY_FAMILY_KEY, fid);
                } catch (e) {
                    console.error('Family save error:', e);
                }
            };

            // Later switches: session-only, and confirmed once per session.
            const requestFamily = (fid) => {
                if (fid === myFamily) return;
                if (fid === deviceFamily) { setActiveFamily(null); return; }
                if (switchConfirmed) { setActiveFamily(fid); return; }
                setPendingFamily(fid);
            };

            const confirmSwitch = () => {
                setActiveFamily(pendingFamily);
                setSwitchConfirmed(true);
                setPendingFamily(null);
            };

            // Renders the GENERATED schedule to a PNG. Every name comes from the
            // runtime NAME_MAP, so with no config it draws the placeholders.
            const drawScheduleCanvas = () => {
                // Same four columns as the on-screen table: Dan | Djeca | Odvoz | Povratak
                const W = 1080, PAD = 64, ROW = 104, HEAD = 182;
                const COLS = [
                    { x: PAD,       w: 96  },   // Dan
                    { x: PAD + 104, w: 320 },   // Djeca
                    { x: PAD + 432, w: 258 },   // Odvoz
                    { x: PAD + 700, w: 252 }    // Povratak
                ];
                const rows = PRACTICES.map(p => ({
                    p,
                    kids: attendingOn(p.id).map(c => NAME_MAP.children[c]),
                    to: assignments[`${p.id}-tamo`] ? NAME_MAP.families[assignments[`${p.id}-tamo`]] : null,
                    from: assignments[`${p.id}-nazad`] ? NAME_MAP.families[assignments[`${p.id}-nazad`]] : null
                }));

                const canvas = document.createElement('canvas');
                canvas.width = W;
                canvas.height = PAD * 2 + HEAD + 24 + rows.length * ROW;
                const g = canvas.getContext('2d');

                let archivo = false;
                try { archivo = document.fonts.check('800 32px Archivo'); } catch (e) {}
                const FF = archivo ? 'Archivo, sans-serif' : 'system-ui, -apple-system, sans-serif';

                g.fillStyle = '#f3f2f2';
                g.fillRect(0, 0, canvas.width, canvas.height);
                g.textBaseline = 'top';

                g.fillStyle = '#201e1d';
                g.font = `800 46px ${FF}`;
                g.fillText('RASPORED PRIJEVOZA', PAD, PAD);
                g.font = `800 32px ${FF}`;
                g.fillText(formatWeekRange(weekStart).toUpperCase(), PAD, PAD + 62);

                // shrink to fit the column rather than spill into the next one
                const setFit = (text, weight, size, maxW) => {
                    let s = size;
                    g.font = `${weight} ${s}px ${FF}`;
                    while (g.measureText(text).width > maxW && s > 13) {
                        s -= 1;
                        g.font = `${weight} ${s}px ${FF}`;
                    }
                };

                let y = PAD + HEAD - 40;
                g.fillStyle = '#6f6b68';
                ['DAN', 'DJECA', 'ODVOZ', 'POVRATAK'].forEach((h, i) => {
                    g.font = `800 20px ${FF}`;
                    g.fillText(h, COLS[i].x, y);
                });
                y += 30;
                g.fillStyle = '#201e1d';
                g.fillRect(PAD, y, W - PAD * 2, 4);
                y += 22;

                rows.forEach(r => {
                    g.fillStyle = '#201e1d';
                    g.font = `800 30px ${FF}`;
                    g.fillText(r.p.day, COLS[0].x, y + 6);
                    g.font = `400 20px ${FF}`;
                    g.fillStyle = '#6f6b68';
                    g.fillText(startTime(r.p), COLS[0].x, y + 42);

                    if (r.kids.length) {
                        g.fillStyle = '#201e1d';
                        const txt = r.kids.join(', ');
                        setFit(txt, 400, 26, COLS[1].w);
                        g.fillText(txt, COLS[1].x, y + 12);
                    } else {
                        g.fillStyle = '#b9b7b4';
                        g.font = `400 26px ${FF}`;
                        g.fillText('nitko', COLS[1].x, y + 12);
                    }

                    [[r.to, 2], [r.from, 3]].forEach(([val, i]) => {
                        if (val) {
                            g.fillStyle = '#201e1d';
                            setFit(val, 800, 28, COLS[i].w);
                            g.fillText(val, COLS[i].x, y + 10);
                        } else if (r.kids.length) {
                            g.fillStyle = '#ec3013';
                            setFit('nema vozača', 800, 28, COLS[i].w);
                            g.fillText('nema vozača', COLS[i].x, y + 10);
                        } else {
                            g.fillStyle = '#b9b7b4';
                            g.font = `400 26px ${FF}`;
                            g.fillText('—', COLS[i].x, y + 10);
                        }
                    });

                    g.fillStyle = '#d6d4d2';
                    g.fillRect(PAD, y + ROW - 20, W - PAD * 2, 2);
                    y += ROW;
                });

                return canvas;
            };

            const sharePhoto = async () => {
                setPhotoNote('');
                setPhotoBusy(true);
                try {
                    const canvas = drawScheduleCanvas();
                    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                    if (!blob) throw new Error('render failed');
                    const file = new File([blob], `raspored-${weekKey}.png`, { type: 'image/png' });

                    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file] });
                    } else {
                        // No file sharing (desktop, older Android): save the PNG instead.
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = file.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        setTimeout(() => URL.revokeObjectURL(url), 5000);
                        setPhotoNote('Slika je spremljena na uređaj.');
                    }
                } catch (e) {
                    if (!e || e.name !== 'AbortError') {   // AbortError = share sheet dismissed
                        console.error('Share error:', e);
                        setPhotoNote('Slanje nije uspjelo. Pokušaj ponovno.');
                    }
                } finally {
                    setPhotoBusy(false);
                }
            };

            if (isLoading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center px-4">
                        <div className="brum-bounce">
                            <Ball size={56} solid />
                        </div>
                        <div className="mt-7 text-[13px] font-extrabold tracking-[0.12em] uppercase">Učitavam…</div>
                    </div>
                );
            }

            const gridCols = { display: 'grid', gridTemplateColumns: '84px repeat(5, 1fr)', gap: '4px' };
            // Spacer column separates the DIJETE group from the OBITELJ VOZI group.
            const editCols = { display: 'grid', gridTemplateColumns: '1fr 68px 14px 68px 68px', gap: '4px' };
            const Gap = () => <div className="justify-self-center w-px h-full bg-[#d6d4d2]"></div>;
            const tableCols = { display: 'grid', gridTemplateColumns: '32px 1fr 1fr 1fr', gap: '6px' };

            // Read-only heatmap: small flat marks centred in the column, deliberately
            // nothing like the big bordered cells of the editing matrix below.
            const OverviewCell = ({ state }) => (
                <div className="h-[30px] flex items-center justify-center">
                    {state === 'on' && <div className="w-5 h-5 bg-[#201e1d]"></div>}
                    {state === 'off' && <div className="w-5 h-5 bg-[#e6e5e3]"></div>}
                    {state === 'empty' && <div className="w-5 h-5 border border-dashed border-[#b9b7b4]"></div>}
                </div>
            );

            // Same mark scale as the overview rows above it.
            const CoverageCell = ({ dayId, leg }) => {
                const c = coverage(dayId, leg);
                if (c.kind === 'none') {
                    return <div className="h-[30px] flex items-center justify-center text-[#b9b7b4] text-[12px]">·</div>;
                }
                if (c.kind === 'missing') {
                    return (
                        <div className="h-[30px] flex items-center justify-center">
                            <div className="pebble w-5 h-5 bg-[#ec3013] flex items-center justify-center text-white text-[12px] font-extrabold leading-none">–</div>
                        </div>
                    );
                }
                // One or several families: plain ink numbers, no emphasis either way.
                return (
                    <div className="h-[30px] flex items-center justify-center gap-1.5">
                        {c.drivers.map(f => (
                            <span key={f} className="text-[#201e1d] text-[13px] font-extrabold leading-none">{familyNumber(f)}</span>
                        ))}
                    </div>
                );
            };

            // No red states here at all: the personal matrix is pure input, and
            // sharing a leg with another family is normal, not an error.
            const Toggle = ({ item, dayId, type }) => {
                const key = `${item}-${dayId}-${type}`;
                const on = selections[key] === true;
                const locked = isLocked(dayId);

                let cls = 'border border-[#d6d4d2] bg-[#efeeec] text-[#b9b7b4]';
                if (on) cls = 'bg-[#201e1d] text-white border border-[#201e1d]';

                return (
                    <button
                        type="button"
                        onClick={() => { if (!locked) toggleSelection(item, dayId, type); }}
                        disabled={locked}
                        aria-pressed={on}
                        className={`h-12 w-full flex items-center justify-center text-[18px] font-extrabold ${cls} ${locked ? 'opacity-40 cursor-not-allowed' : ''}`}
                    >
                        ✓
                    </button>
                );
            };

            const Toast = () => {
                if (saveState === 'idle') return null;
                const base = 'fixed left-0 right-0 bottom-0 px-4 py-3 flex items-center justify-between gap-3 z-50';
                if (saveState === 'saving') {
                    return (
                        <div className={`${base} bg-[#201e1d] text-white`}>
                            <span className="text-[13px] font-extrabold tracking-[0.12em] uppercase">Spremam…</span>
                        </div>
                    );
                }
                if (saveState === 'saved') {
                    return (
                        <div className={`${base} bg-[#201e1d] text-white`}>
                            <span className="text-[13px] font-extrabold tracking-[0.12em] uppercase">
                                ✓ Spremljeno u {savedAt.toLocaleTimeString('hr-HR', { hour: '2-digit', minute: '2-digit' })}
                            </span>
                        </div>
                    );
                }
                if (saveState === 'unauthorized') {
                    return (
                        <div className={`${base} bg-[#ec3013] text-white`}>
                            <span className="text-[13px] font-semibold leading-snug">
                                Za spremanje klikni privatni link iz WhatsApp grupe
                            </span>
                        </div>
                    );
                }
                return (
                    <div className={`${base} bg-[#ec3013] text-white`}>
                        <span className="text-[13px] font-semibold leading-snug">Nije spremljeno, pokušaj ponovno</span>
                        <button
                            type="button"
                            onClick={() => saveToSheets(pendingSave)}
                            className="shrink-0 h-11 px-4 bg-white text-[#ec3013] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Pokušaj ponovno
                        </button>
                    </div>
                );
            };

            const WeekNav = () => (
                <div className="flex items-center gap-3 mt-5">
                    <button
                        type="button"
                        onClick={goPrev}
                        aria-label="Prethodni tjedan"
                        className="w-11 h-11 shrink-0 border border-[#201e1d] text-[18px] font-semibold flex items-center justify-center"
                    >‹</button>
                    <div
                        onClick={onRangeTap}
                        className="flex-1 text-[15px] font-extrabold tracking-[0.04em] uppercase text-center select-none"
                    >
                        {formatWeekRange(weekStart)}
                    </div>
                    <button
                        type="button"
                        onClick={goNext}
                        aria-label="Sljedeći tjedan"
                        className="w-11 h-11 shrink-0 border border-[#201e1d] text-[18px] font-semibold flex items-center justify-center"
                    >›</button>
                </div>
            );

            // ---- results screen ----
            if (showResults) {
                return (
                    <div className="max-w-[560px] mx-auto px-4 pt-6 pb-32">
                        <MissingNamesBanner />

                        <h1 className="text-[27px] leading-[1.05] font-extrabold tracking-[-0.01em] uppercase">
                            Predloženi raspored
                        </h1>
                        <div className="text-[15px] font-extrabold tracking-[0.04em] uppercase mt-3">
                            {formatWeekRange(weekStart)}
                        </div>

                        {(lastModified || lastGenerated) && (
                            <div className="mt-3 text-[11px] text-[#6f6b68] leading-relaxed">
                                {lastGenerated && <div>Generirano: {new Date(lastGenerated).toLocaleString('hr-HR')}</div>}
                                {lastEditLine()
                                    ? <div>{lastEditLine()}</div>
                                    : lastModified && <div>Zadnja promjena: {new Date(lastModified).toLocaleString('hr-HR')}</div>}
                            </div>
                        )}

                        {dataChangedSinceGeneration() && (
                            <div className="mt-4 border-2 border-[#ec3013] px-3 py-2">
                                <p className="text-[12px] font-semibold text-[#ec3013] leading-snug">
                                    Podaci su promijenjeni nakon generiranja. Generiraj ponovno.
                                </p>
                            </div>
                        )}

                        <Rule />

                        {/* one compact table: Dan | Djeca | Odvoz | Povratak */}
                        <div style={tableCols} className="pb-2 border-b-2 border-[#201e1d]">
                            <div className="text-[10px] font-extrabold tracking-[0.06em] uppercase text-[#6f6b68]">Dan</div>
                            <div className="text-[10px] font-extrabold tracking-[0.06em] uppercase text-[#6f6b68]">Djeca</div>
                            <div className="text-[10px] font-extrabold tracking-[0.06em] uppercase text-[#6f6b68]">Odvoz</div>
                            <div className="text-[10px] font-extrabold tracking-[0.06em] uppercase text-[#6f6b68]">Povratak</div>
                        </div>

                        {PRACTICES.map(p => {
                            const attending = attendingOn(p.id);
                            const cell = (leg) => {
                                const f = assignments[`${p.id}-${leg}`];
                                if (f) return <span className="font-extrabold break-words">{NAME_MAP.families[f]}</span>;
                                if (attending.length > 0) return <span className="font-extrabold text-[#ec3013] break-words">nema vozača</span>;
                                return <span className="text-[#b9b7b4]">—</span>;
                            };
                            return (
                                <div key={p.id} style={tableCols} className="py-2 border-b border-[#d6d4d2] text-[12px] items-start">
                                    <div>
                                        <div className="font-extrabold leading-tight">{p.day}</div>
                                        <div className="text-[10px] text-[#6f6b68]">{startTime(p)}</div>
                                    </div>
                                    <div className="break-words">
                                        {attending.length > 0
                                            ? attending.map(c => NAME_MAP.children[c]).join(', ')
                                            : <span className="text-[#b9b7b4]">nitko</span>}
                                    </div>
                                    <div>{cell('tamo')}</div>
                                    <div>{cell('nazad')}</div>
                                </div>
                            );
                        })}

                        <button
                            type="button"
                            onClick={sharePhoto}
                            disabled={photoBusy}
                            className="mt-5 min-h-12 w-full border border-[#201e1d] px-3 py-2 text-[12px] font-semibold leading-snug disabled:opacity-60"
                        >
                            {photoBusy ? 'Pripremam…' : 'Podijeli fotku rasporeda na WhatsApp'}
                        </button>
                        {photoNote && (
                            <p className="mt-2 text-[11px] text-[#6f6b68] leading-snug">{photoNote}</p>
                        )}

                        <button
                            type="button"
                            onClick={() => setShowResults(false)}
                            className="mt-3 h-12 w-full bg-[#201e1d] text-white text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Uredi dostupnost
                        </button>

                        <button
                            type="button"
                            onClick={resetCurrentWeek}
                            className="mt-3 h-12 w-full border-2 border-[#ec3013] text-[#ec3013] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                        >
                            Reset tjedan
                        </button>

                        <Toast />
                    </div>
                );
            }

            // ---- editing screen ----
            return (
                <div className="max-w-[560px] mx-auto px-4 pt-6 pb-32">
                    <MissingNamesBanner />

                    <h1 className="text-[27px] leading-[1.05] font-extrabold tracking-[-0.01em] uppercase">
                        Tjedni raspored treninga
                    </h1>
                    <p className="text-[14px] text-[#6f6b68] mt-2">Označi kad dijete dolazi i kad možeš voziti</p>

                    <WeekNav />

                    {lastEditLine() && (
                        <p className="mt-3 text-[11px] text-[#6f6b68]">{lastEditLine()}</p>
                    )}

                    {askNewWeek && (
                        <div className="mt-3 border-2 border-[#201e1d] px-3 py-3 flex items-center justify-between gap-3">
                            <span className="text-[13px] font-semibold">Započni novi tjedan?</span>
                            <div className="flex gap-2 shrink-0">
                                <button
                                    type="button"
                                    onClick={confirmNewWeek}
                                    className="h-11 px-4 bg-[#201e1d] text-white text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                >Da</button>
                                <button
                                    type="button"
                                    onClick={() => setAskNewWeek(false)}
                                    className="h-11 px-4 border border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                >Ne</button>
                            </div>
                        </div>
                    )}

                    <Rule />

                    {/* R0 — overview matrix */}
                    <SectionLabel>Raspored</SectionLabel>

                    {Object.keys(selections).length === 0 && (
                        <p className="text-[12px] text-[#6f6b68] mb-3">Nitko još nije upisan 🏀</p>
                    )}

                    <div style={gridCols} className="mb-1">
                        <div></div>
                        {PRACTICES.map(p => (
                            <div key={p.id} className="text-center leading-tight">
                                <div className="text-[12px] font-extrabold">{p.day}</div>
                                <div className="text-[10px] text-[#6f6b68]">{startTime(p)}</div>
                            </div>
                        ))}
                    </div>

                    {CHILD_IDS.map(childId => (
                        <div key={childId} style={gridCols} className="mb-0.5 items-center">
                            <div className="text-[13px] font-extrabold truncate pr-1" title={NAME_MAP.children[childId]}>
                                {NAME_MAP.children[childId]}
                            </div>
                            {PRACTICES.map(p => (
                                <OverviewCell key={p.id} state={cellState(`${childId}-${p.id}-child`)} />
                            ))}
                        </div>
                    ))}

                    {/* R1 — coverage rows, one per leg (delta vs prototype) */}
                    <div className="border-t-2 border-[#201e1d] mt-2 pt-2">
                        <div style={gridCols} className="mb-0.5 items-center">
                            <div className="text-[13px] font-extrabold truncate pr-1">Odvoz</div>
                            {PRACTICES.map(p => <CoverageCell key={p.id} dayId={p.id} leg="tamo" />)}
                        </div>
                        <div style={gridCols} className="items-center">
                            <div className="text-[13px] font-extrabold truncate pr-1">Povratak</div>
                            {PRACTICES.map(p => <CoverageCell key={p.id} dayId={p.id} leg="nazad" />)}
                        </div>
                    </div>

                    {/* One row at 390 px (R1): 10 px, tight gaps, swatches separate
                        the items so the "·" dividers are not needed to fit. */}
                    <div className="mt-3 flex flex-wrap items-center justify-between gap-x-1.5 gap-y-1 text-[10px] leading-none text-[#6f6b68] [&>span]:whitespace-nowrap">
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 bg-[#201e1d] inline-block"></span>dolazi</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 bg-[#e6e5e3] inline-block"></span>ne dolazi</span>
                        <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 shrink-0 border border-dashed border-[#b9b7b4] inline-block"></span>još prazno</span>
                        <span>broj = obitelj koja može voziti</span>
                        <span className="text-[#ec3013] font-semibold">crveno = nema vozača</span>
                    </div>

                    <Rule />

                    {/* R2 — MOJA OBITELJ. Hidden until this device has chosen;
                        the blocking prompt below does that job first. */}
                    {hasFamily && (
                        <div>
                            <SectionLabel>Moja obitelj</SectionLabel>
                            <div className="grid grid-cols-3 border-2 border-[#201e1d]">
                                {FAMILY_IDS.map((fid, i) => (
                                    <button
                                        key={fid}
                                        type="button"
                                        onClick={() => requestFamily(fid)}
                                        aria-pressed={myFamily === fid}
                                        title={NAME_MAP.families[fid]}
                                        className={`h-12 px-1 text-[13px] truncate ${i > 0 ? 'border-l-2 border-[#201e1d]' : ''} ${
                                            myFamily === fid ? 'pebble bg-[#ec3013] text-white font-extrabold' : 'bg-white font-semibold'
                                        }`}
                                    >
                                        {NAME_MAP.families[fid]}
                                    </button>
                                ))}
                            </div>

                            {activeFamily && (
                                <p className="mt-2 text-[11px] text-[#ec3013] font-semibold leading-snug">
                                    Unosiš za {NAME_MAP.families[activeFamily]}. Nakon zatvaranja aplikacije vraća se na {NAME_MAP.families[deviceFamily]}.
                                </p>
                            )}

                            {pendingFamily && (
                                <div className="mt-3 border-2 border-[#ec3013] px-3 py-3">
                                    <p className="text-[13px] font-semibold leading-snug mb-3">
                                        Unosiš za obitelj {NAME_MAP.families[pendingFamily]}, ne za svoju. Nastaviti?
                                    </p>
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={confirmSwitch}
                                            className="h-11 px-4 bg-[#ec3013] text-white text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                        >Da</button>
                                        <button
                                            type="button"
                                            onClick={() => setPendingFamily(null)}
                                            className="h-11 px-4 border border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                        >Ne</button>
                                    </div>
                                </div>
                            )}

                            <Rule />
                        </div>
                    )}

                    {/* R3 — editing surface, gated behind the family choice */}
                    {!hasFamily ? (
                        <div className="border-2 border-[#201e1d] p-4">
                            <p className="text-[17px] font-extrabold uppercase tracking-[0.04em]">Koja obitelj?</p>
                            <p className="text-[12px] text-[#6f6b68] leading-snug mt-2 mb-4">
                                Odaberi obitelj da otključaš unos. Pamti se na ovom uređaju.
                            </p>
                            <div className="flex flex-col gap-2">
                                {FAMILY_IDS.map(fid => (
                                    <button
                                        key={fid}
                                        type="button"
                                        onClick={() => pickDeviceFamily(fid)}
                                        className="min-h-14 w-full bg-[#201e1d] text-white text-[16px] font-extrabold px-3 break-words"
                                    >
                                        {NAME_MAP.families[fid]}
                                    </button>
                                ))}
                            </div>
                        </div>
                    ) : (
                    <div>
                    <SectionLabel>
                        Tjedan za: {NAME_MAP.children[myChild]} / {NAME_MAP.families[myFamily]}
                    </SectionLabel>

                    {/* group headers: what the child does vs what the family drives */}
                    <div style={editCols} className="mb-1 items-end">
                        <div></div>
                        <div className="text-[10px] font-extrabold tracking-[0.08em] uppercase text-[#201e1d] text-center border-b-2 border-[#201e1d] pb-1">
                            Dijete
                        </div>
                        <div></div>
                        <div style={{ gridColumn: 'span 2' }} className="text-[10px] font-extrabold tracking-[0.08em] uppercase text-[#201e1d] text-center border-b-2 border-[#201e1d] pb-1">
                            Obitelj vozi
                        </div>
                    </div>

                    <div style={editCols} className="mb-1">
                        <div></div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Dolazi</div>
                        <div></div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Odvoz</div>
                        <div className="text-[11px] font-extrabold tracking-[0.08em] uppercase text-[#6f6b68] text-center">Povratak</div>
                    </div>

                    {PRACTICES.map(p => (
                        <div key={p.id} style={editCols} className="mb-1 items-center">
                            <div className="pr-2">
                                <div className="text-[15px] font-extrabold leading-tight">{p.day}</div>
                                <div className="text-[12px] text-[#6f6b68]">{startTime(p)}</div>
                            </div>
                            <Toggle item={myChild} dayId={p.id} type="child" />
                            <Gap />
                            <Toggle item={myFamily} dayId={p.id} type="tamo" />
                            <Toggle item={myFamily} dayId={p.id} type="nazad" />
                        </div>
                    ))}

                    </div>
                    )}

                    {/* A generate button exists only when pressing it would change
                        something. State 1 offers the way back to the schedule,
                        state 2 offers exactly one regenerate, state 3 the first
                        generate, state 4 nothing. */}
                    {hasFamily && (hasEnoughData() || scheduleExists()) && (
                        <div className="mt-5">
                            {scheduleExists() && !dataChangedSinceGeneration() ? (
                                // 1) current schedule — nothing to generate
                                <button
                                    type="button"
                                    onClick={() => setShowResults(true)}
                                    className="h-14 w-full bg-[#201e1d] text-white text-[13px] font-extrabold tracking-[0.08em] uppercase"
                                >
                                    Pregled rasporeda
                                </button>
                            ) : scheduleExists() ? (
                                // 2) stale — regenerate is the only generate action
                                <div>
                                    <div className="border-2 border-[#ec3013] px-3 py-2 mb-3">
                                        <p className="text-[12px] font-semibold text-[#ec3013] leading-snug">
                                            Podaci su promijenjeni nakon generiranja.
                                        </p>
                                    </div>
                                    {hasEnoughData() && (
                                        <button
                                            type="button"
                                            onClick={generateAssignments}
                                            className="pebble h-14 w-full bg-[#ec3013] text-white text-[13px] font-extrabold tracking-[0.08em] uppercase"
                                        >
                                            Generiraj ponovno
                                        </button>
                                    )}
                                    <button
                                        type="button"
                                        onClick={() => setShowResults(true)}
                                        className="mt-3 h-12 w-full border-2 border-[#201e1d] text-[12px] font-extrabold tracking-[0.08em] uppercase"
                                    >
                                        Prikaži stari raspored
                                    </button>
                                </div>
                            ) : (
                                // 3) no schedule yet, enough data
                                <button
                                    type="button"
                                    onClick={generateAssignments}
                                    className="pebble h-14 w-full bg-[#ec3013] text-white text-[13px] font-extrabold tracking-[0.08em] uppercase"
                                >
                                    Generiraj raspored
                                </button>
                            )}
                        </div>
                    )}

                    <Toast />
                </div>
            );
        };

        ReactDOM.render(<CarpoolApp />, document.getElementById('root'));
    </script>
</body>
</html>
